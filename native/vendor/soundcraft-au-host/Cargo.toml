[package]
name = "soundcraft-au-host"
description = "Audio Unit (AUv2/AUv3, macOS) effect host based on SoundCraft: system discovery, bounded asynchronous loading, audio processing and native editors behind the safe soundcraft-dsp Plugin trait"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
soundcraft-dsp.workspace = true
serde.workspace = true
thiserror.workspace = true
log.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
soundcraft-vst3-host.workspace = true
objc2 = "0.6"
block2 = "0.6"
libloading = "0.9"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSGeometry", "NSObject", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSViewController", "NSWindow"] }

# An isolated unsafe helper crate (craftrules never-crash), like soundcraft-vst3-host: this crate
# opts out of the workspace `unsafe_code = "forbid"` for itself only. It denies unsafe everywhere
# and allows it solely on the FFI module (`src/ffi.rs`). The rest mirrors `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
